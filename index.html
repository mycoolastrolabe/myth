<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astrology Placements and Aspects: Mythological Correspondences</title>
    <style>
     
        * {
            box-sizing: border-box;
        }

        body {
            background-color: #ffffff;
            color: #000000;
            font-family: "Courier New", Courier, monospace, Times, serif;
            margin: 0;
            padding: 20px;
            font-size: 14px;
            line-height: 1.5;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            border: 2px solid #000000;
            padding: 20px;
        }

        header {
            border-bottom: 2px solid #000000;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 20px;
            margin: 0 0 10px 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .subtitle {
            font-size: 13px;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        /* Controls Area */
        .controls-panel {
            border: 1px solid #000000;
            padding: 12px;
            margin-bottom: 20px;
            background-color: #ffffff;
        }

        .search-box {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            gap: 10px;
        }

        .search-box label {
            font-weight: bold;
            white-space: nowrap;
        }

        input[type="text"] {
            width: 100%;
            padding: 6px;
            border: 1px solid #000000;
            background-color: #ffffff;
            color: #000000;
            font-family: inherit;
            font-size: 14px;
            outline: none;
        }

        .button-bar {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        /* Button Styling */
        button {
            background-color: #ffffff;
            color: #000000;
            border: 2px solid #000000;
            padding: 4px 12px;
            font-family: inherit;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            outline: none;
            box-shadow: 2px 2px 0px #000000;
            border-radius: 0;
        }

        button:hover {
            background-color: #ffffff;
            color: #000000;
        }

        button:active {
            box-shadow: 0px 0px 0px #000000;
            transform: translate(2px, 2px);
        }

        /* Tree and Content Structure */
        .section-header {
            font-size: 16px;
            font-weight: bold;
            border-bottom: 1px dashed #000000;
            padding: 6px 0;
            margin-top: 20px;
            margin-bottom: 10px;
            cursor: pointer;
            user-select: none;
            display: flex;
            align-items: center;
        }

        .toggle-btn {
            display: inline-block;
            width: 24px;
            font-weight: bold;
            text-align: center;
            margin-right: 5px;
            font-family: monospace;
        }

        .tree-node {
            margin-left: 0px;
        }

        .level-1 {
            margin-left: 15px;
            border-left: 1px dotted #000000;
            padding-left: 10px;
            margin-top: 4px;
            margin-bottom: 4px;
        }

        .level-1-header {
            font-weight: bold;
            cursor: pointer;
            user-select: none;
            padding: 2px 0;
        }

        .level-2 {
            margin-left: 20px;
            border-left: 1px dotted #000000;
            padding-left: 10px;
            margin-top: 2px;
            margin-bottom: 4px;
        }

        .level-2-header {
            font-weight: bold;
            cursor: pointer;
            user-select: none;
        }

        .level-3 {
            margin-left: 20px;
            margin-top: 2px;
            margin-bottom: 4px;
        }

        /* Entry Row with [VIEW PAGE] button aligned below text */
        .entry-row {
            margin: 6px 0 10px 10px;
            padding: 4px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 6px;
            border-bottom: 1px dotted #cccccc;
        }

        .entry-text {
            width: 100%;
            word-break: break-word;
        }

        .view-btn {
            padding: 2px 8px;
            font-size: 11px;
            box-shadow: 1px 1px 0px #000000;
            white-space: nowrap;
            margin-left: 0px;
        }

        .empty-node {
            font-style: italic;
            color: #555555;
            margin-left: 20px;
            margin-top: 4px;
        }

        .hidden {
            display: none !important;
        }

        .loading-msg {
            font-style: italic;
            margin: 20px 0;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Astrology Placements and Aspects</h1>
        <div class="subtitle">Mythological Correspondence Index</div>
    </header>

    <!-- MAIN INDEX PAGE VIEW -->
    <div id="indexPage">
        <div class="controls-panel">
            <div class="search-box">
                <label for="searchInput">SEARCH:</label>
                <input type="text" id="searchInput" placeholder="Type to filter (e.g., Rama, Enki, Tauroctony, Venus)..." autocomplete="off">
            </div>
            <div class="button-bar">
                <button type="button" id="expandAllBtn">[+] EXPAND ALL</button>
                <button type="button" id="collapseAllBtn">[-] COLLAPSE ALL</button>
            </div>
        </div>

        <div id="contentTree">
            <div class="loading-msg" id="loadingMsg">Loading correspondences...</div>
        </div>
    </div>
</div>


<script id="correspondences-data" type="text/plain">

>>Mercury: Enki's flood warning. Hanging Wotan. Medieval and Renaissance Hermeticism. Mahayana Buddhism.
>>Venus: Birth of Aphrodite. Islam. Tantra and Shaktism.

>>>Conjunction: New Moon. Alchemical union. Rebis.
>>>Opposition: Full Moon. Division of the sexes (Plato). All kinds of mirrors.

>>>Sextile: Creation of man (Prometheus and Athena, Enki and Mammi).

>>>Saturn: Bhairava as Kshethrapala and gateway to Devi.

>>North Node
>>>Square: Hercules battling the Hydra.

>Saturn

</script>

<script>
    // Utility to slugify string for URLs and element IDs
    function slugify(text) {
        return text.toString().toLowerCase()
            .replace(/\s+/g, '-')
            .replace(/[^\w\-]+/g, '')
            .replace(/\-\-+/g, '-')
            .replace(/^-+/, '')
            .replace(/-+$/, '');
    }

    // Toggle expand/collapse node
    function toggleNode(bodyId, iconId) {
        const bodyEl = document.getElementById(bodyId);
        const iconEl = document.getElementById(iconId);
        if (!bodyEl) return;

        if (bodyEl.classList.contains('hidden')) {
            bodyEl.classList.remove('hidden');
            if (iconEl) iconEl.textContent = '[-]';
        } else {
            bodyEl.classList.add('hidden');
            if (iconEl) iconEl.textContent = '[+]';
        }
    }

    // Expand All / Collapse All Tree Logic
    function setAllNodesState(expand) {
        const containers = document.querySelectorAll('#contentTree .level-3, #contentTree div[id$="-body"]');
        const icons = document.querySelectorAll('#contentTree .toggle-btn');

        containers.forEach(el => {
            if (expand) {
                el.classList.remove('hidden');
            } else {
                el.classList.add('hidden');
            }
        });

        icons.forEach(el => {
            el.textContent = expand ? '[-]' : '[+]';
        });
    }

    // Search Filtering Functionality
    function filterTree(query) {
        const q = query.trim().toLowerCase();
        const entryRows = document.querySelectorAll('.entry-row');

        if (q === '') {
            setAllNodesState(false);
            return;
        }

        setAllNodesState(false);

        entryRows.forEach(row => {
            const textEl = row.querySelector('.entry-text');
            if (!textEl) return;
            const text = textEl.textContent.toLowerCase();
            if (text.includes(q)) {
                let curr = row.parentElement;
                while (curr && curr.id !== 'contentTree') {
                    if (curr.classList.contains('hidden')) {
                        curr.classList.remove('hidden');
                    }
                    if (curr.id && curr.id.endsWith('-body')) {
                        const iconId = curr.id.replace('-body', '-icon');
                        const iconEl = document.getElementById(iconId);
                        if (iconEl) iconEl.textContent = '[-]';
                    }
                    curr = curr.parentElement;
                }
            }
        });
    }

    // Parse the custom txt format into a structured object
    function parseCorrespondencesText(text) {
        const lines = text.split(/\r?\n/);
        const root = { title: "Root", children: [] };

        let currentSection = null;
        let currentLevel1 = null;
        let currentLevel2 = null;
        let currentLevel3 = null;

        lines.forEach(line => {
            const trimmed = line.trim();
            if (!trimmed) return;

            // SECTION HEADER (PLACEMENTS / ASPECTS)
            if (/^[A-Z\s]+$/.test(trimmed) && (trimmed === "PLACEMENTS" || trimmed === "ASPECTS")) {
                currentSection = { title: trimmed, children: [] };
                root.children.push(currentSection);
                currentLevel1 = null;
                currentLevel2 = null;
                currentLevel3 = null;
            } 
            // >>> ENTRY (LEVEL 3 / LEVEL 4)
            else if (line.startsWith(">>>")) {
                const title = line.substring(3).trim();
                const [aspectName, textContent] = title.includes(":") ? title.split(/:(.+)/) : [title, ""];
                
                if (textContent !== "") {
                    // Aspect angle with content
                    const aspectNode = { title: aspectName.trim(), children: [], text: textContent.trim() };
                    if (currentLevel2) {
                        currentLevel2.children.push(aspectNode);
                    }
                } else if (currentLevel2) {
                    currentLevel2.children.push({ title: title, children: [] });
                }
            } 
            // >> SUB-CATEGORY (LEVEL 2)
            else if (line.startsWith(">>")) {
                const content = line.substring(2).trim();
                const [title, textContent] = content.includes(":") ? content.split(/:(.+)/) : [content, null];

                currentLevel2 = { 
                    title: title.trim(), 
                    text: textContent ? textContent.trim() : null, 
                    children: [] 
                };

                if (currentLevel1) {
                    currentLevel1.children.push(currentLevel2);
                }
            } 
            // > CATEGORY (LEVEL 1)
            else if (line.startsWith(">")) {
                const title = line.substring(1).trim();
                currentLevel1 = { title: title, children: [] };
                if (currentSection) {
                    currentSection.children.push(currentLevel1);
                }
                currentLevel2 = null;
            }
        });

        return root;
    }

    // Render tree HTML dynamically from parsed data
    function renderTree(parsedData) {
        const treeContainer = document.getElementById('contentTree');
        treeContainer.innerHTML = '';

        parsedData.children.forEach(section => {
            const sectionId = `section-${slugify(section.title)}`;
            const sectionBodyId = `${slugify(section.title)}-body`;
            const sectionIconId = `${slugify(section.title)}-icon`;

            const sectionEl = document.createElement('div');
            sectionEl.className = 'tree-node main-section';
            sectionEl.id = sectionId;

            let sectionHTML = `
                <div class="section-header" onclick="toggleNode('${sectionBodyId}', '${sectionIconId}')">
                    <span class="toggle-btn" id="${sectionIconId}">[+]</span>
                    <span>${section.title}</span>
                </div>
                <div id="${sectionBodyId}" class="hidden">
            `;

            section.children.forEach(level1 => {
                const l1BodyId = `${slugify(section.title)}-${slugify(level1.title)}-body`;
                const l1IconId = `${slugify(section.title)}-${slugify(level1.title)}-icon`;

                sectionHTML += `
                    <div class="level-1">
                        <div class="level-1-header" onclick="toggleNode('${l1BodyId}', '${l1IconId}')">
                            <span class="toggle-btn" id="${l1IconId}">[+]</span> ${level1.title}
                        </div>
                        <div id="${l1BodyId}" class="hidden">
                `;

                if (level1.children.length === 0) {
                    sectionHTML += `<div class="empty-node">(No entries listed)</div>`;
                } else {
                    level1.children.forEach(level2 => {
                        const l2BodyId = `${slugify(section.title)}-${slugify(level1.title)}-${slugify(level2.title)}-body`;
                        const l2IconId = `${slugify(section.title)}-${slugify(level1.title)}-${slugify(level2.title)}-icon`;

                        if (level2.text) {
                            // Direct entry without aspect angles
                            const filePath = `entries/${slugify(section.title)}-${slugify(level1.title)}-${slugify(level2.title)}.html`;
                            sectionHTML += `
                                <div class="level-2">
                                    <div class="level-2-header" onclick="toggleNode('${l2BodyId}', '${l2IconId}')">
                                        <span class="toggle-btn" id="${l2IconId}">[+]</span> ${level2.title}
                                    </div>
                                    <div id="${l2BodyId}" class="level-3 hidden">
                                        <div class="entry-row">
                                            <span class="entry-text">${level2.text}</span>
                                            <a href="${filePath}"><button type="button" class="view-btn">[VIEW PAGE]</button></a>
                                        </div>
                                    </div>
                                </div>
                            `;
                        } else {
                            // Level 2 has children (e.g. Aspect angles like Conjunction, Opposition)
                            sectionHTML += `
                                <div class="level-2">
                                    <div class="level-2-header" onclick="toggleNode('${l2BodyId}', '${l2IconId}')">
                                        <span class="toggle-btn" id="${l2IconId}">[+]</span> ${level2.title}
                                    </div>
                                    <div id="${l2BodyId}" class="level-3 hidden">
                            `;

                            level2.children.forEach(level3 => {
                                const l3BodyId = `${l2BodyId}-${slugify(level3.title)}`;
                                const l3IconId = `${l2IconId}-${slugify(level3.title)}-icon`;
                                const filePath = `entries/${slugify(section.title)}-${slugify(level1.title)}-${slugify(level2.title)}-${slugify(level3.title)}.html`;

                                sectionHTML += `
                                    <div class="level-2">
                                        <div class="level-2-header" onclick="toggleNode('${l3BodyId}', '${l3IconId}')">
                                            <span class="toggle-btn" id="${l3IconId}">[+]</span> ${level3.title}
                                        </div>
                                        <div id="${l3BodyId}" class="level-3 hidden">
                                            <div class="entry-row">
                                                <span class="entry-text">${level3.text}</span>
                                                <a href="${filePath}"><button type="button" class="view-btn">[VIEW PAGE]</button></a>
                                            </div>
                                        </div>
                                    </div>
                                `;
                            });

                            sectionHTML += `
                                    </div>
                                </div>
                            `;
                        }
                    });
                }

                sectionHTML += `
                        </div>
                    </div>
                `;
            });

            sectionHTML += `</div>`;
            sectionEl.innerHTML = sectionHTML;
            treeContainer.appendChild(sectionEl);
        });
    }

    // Load file and initialize
    document.addEventListener('DOMContentLoaded', function() {
        const expandBtn = document.getElementById('expandAllBtn');
        const collapseBtn = document.getElementById('collapseAllBtn');
        const searchInput = document.getElementById('searchInput');

        function processText(textData) {
            const parsed = parseCorrespondencesText(textData);
            renderTree(parsed);
            setAllNodesState(false);
        }

        // Parse embedded raw text data directly (no external file fetching required)
        const dataElement = document.getElementById('correspondences-data');
        if (dataElement) {
            processText(dataElement.textContent);
        } else {
            document.getElementById('loadingMsg').textContent = "Error loading correspondences data.";
        }

        if (expandBtn) expandBtn.addEventListener('click', () => setAllNodesState(true));
        if (collapseBtn) collapseBtn.addEventListener('click', () => setAllNodesState(false));
        if (searchInput) searchInput.addEventListener('input', (e) => filterTree(e.target.value));
    });
</script>

</body>
</html>
